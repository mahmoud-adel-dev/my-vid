<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>مشاهدة المحاضرة | أكاديمية المعرفة</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <script src="config.js" defer></script><script src="assets/app.js" defer></script>
</head>
<body data-page="watch">
  <div class="shell">
    <header class="topbar"><a class="brand" href="index.html"><span class="brand-icon">▶</span><span><strong data-course-title>أكاديمية المعرفة</strong><small>منصة المحاضرات</small></span></a><nav class="menu"><a href="index.html" class="menu-link">← كل المحاضرات</a><button id="logoutBtn" class="text-btn hidden">تسجيل الخروج</button></nav></header>
    <main class="watch-main"><a href="index.html" class="back-link">← العودة إلى المحاضرات</a>
      <section id="loginPanel" class="auth-area"><div class="auth-card"><div class="auth-icon">🔒</div><h2>الدخول إلى المحاضرة</h2><p>أدخل كلمة مرور الطلاب للمشاهدة.</p><form id="loginForm"><label for="password">كلمة المرور</label><div class="input-line"><input id="password" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور" required minlength="10" /><button type="button" class="peek" data-toggle-password="password">إظهار</button></div><button class="primary-btn wide" type="submit">دخول ←</button></form><p class="feedback" id="loginFeedback" role="alert"></p></div></section>
      <section id="playerPanel" class="hidden"><span class="overline">مشاهدة الآن</span><h1 id="watchTitle" class="watch-title">المحاضرة</h1><div class="player-card"><video id="player" controls playsinline preload="metadata" controlsList="nodownload" aria-label="مشغل المحاضرة">متصفحك لا يدعم تشغيل الفيديو.</video></div><div class="watch-actions"><div><div class="watch-meta" id="watchMeta"></div><p class="watch-helper">يمكنك تقديم الفيديو أو إيقافه والعودة إليه لاحقًا.</p></div><a id="downloadBtn" class="primary-btn" download>⇩ تحميل الفيديو</a></div><div id="status" class="notice hidden" role="status"></div></section>
    </main>
    <footer>منصة تعليمية خاصة · <span data-course-title>أكاديمية المعرفة</span></footer>
  </div>
</body>
</html>
